<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Stili spostati in style.css -->
    <header>
      <a class="header-title" href="index.html">DIPLOMACY.GEO</a>
      <nav class="header-nav">
        <a href="categoria.html?cat=europa">Europa</a>
        <a href="categoria.html?cat=asia">Asia</a>
        <a href="categoria.html?cat=usa">USA</a>
        <a href="categoria.html?cat=conflitti">Conflitti</a>
      </nav>
    </header>
  <meta charset="UTF-8">
  <title>DIPLOMACY.GEO</title>
  <link rel="icon" type="image/png" href="assets/images/imresizer-favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="content" id="news-grid">
    <!-- Notizie caricate via JS -->
  </div>
  <script>
    fetch('data/articles.json')
      .then(res => res.json())
      .then(articles => {
        if (!Array.isArray(articles) || articles.length === 0) return;
        const grid = document.getElementById('news-grid');
        let html = '';
        articles.forEach(article => {
          html += `
            <div class="article">
              <h3>
                <a href="article.html?id=${article.id}">${article.title}</a>
              </h3>
              <p>${article.description}</p>
            </div>
          `;
        });
        grid.innerHTML = html;
      });
  </script>
</body>
</html>
