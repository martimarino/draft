<div class="overlay">
  <h1>Europa</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="asia.html">Asia</a>
    <a href="usa.html">USA</a>
    <a href="conflitti.html">Conflitti</a>
  </nav>

  <div class="content" id="articles"></div>
</div>

<script>
fetch("data/europa.json")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("articles");

    data.forEach(article => {
      container.innerHTML += `
        <div class="article">
          <h3>
            <a href="article.html?cat=europa&id=${article.id}">${article.title}</a>
          </h3>
          <p>${article.description}</p>
        </div>
      `;
    });
  });
</script>
